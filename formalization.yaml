automation:
  methods:
    - method: "agent"
      models: ["claude-fable-5-1", "claude-opus-5-5", "claude-sonnet-5-5"]
      framework: "Claude Code"
      tool_setup: >-
        A coordinating Claude Code session (Opus 5.5, later Fable 5.1) delegated work to background
        subagents (Sonnet 5.5 for the blueprint, review and phase-1 implementation rounds; Opus 5.5
        for phase 2 and the final review), each with shell access to Lean/Lake and the Mathlib
        sources. About 45 subagents in all, up to 10 at a time.

        Isolation. Each implementation subagent worked on its own git branch, in a separate git
        worktree sharing the prebuilt Mathlib packages through a symlink, owning only its module's
        files; new helper lemmas went into per-module helper files, so merges were conflict-free
        (one duplicated helper lemma was removed by hand). The coordinator merged after building
        and running scripts/check_statements.py, which verifies that no statement changed since
        the reviewed scaffold (tag scaffold-reviewed). Verification: `lake comparator` (bwrap
        sandbox) against the self-contained FFChallenge.lean.

        Reuse: the multiplier lemma of [OS99] and a Bernstein-space toolkit are vendored from the
        companion formalization MR1682065.
      cost:
        wall_time: "about 13.5 hours (2026-11-06 21:50 – 2026-11-07 11:11 CET, last code commit) for phase 1 and phase 2 (cited results proved up to de Branges' Theorem C)"
        hardware: "API-only models; local workstation (16 cores, 31 GB RAM) for Lean builds"
      prompting_notes: >-
        The user asked for a blueprint with one detailed document per module, explicit
        dependencies and Lean statements; an independent review of the modules; the
        implementation; comparator; this file; a notebook of mistakes found in the source; and a
        corrected tex version of the paper with the changes marked in red. Workflow:
          1. Definitions, cited-result Props, main statements and the blueprint index by the
             coordinator; the cited results as hypotheses was the coordinator's design decision.
          2. Module blueprints by 8 agents, each told to check the page images, not OCR, and to
             report issues in the source and requested changes to the definitions.
          3. Assembly of a compiling scaffold by one agent (import graph, interface
             reconciliation, scripts).
          4. Independent review by 5 referee agents (statements; PW/HB; Theorem 1; the
             construction; Theorem 2), then statement changes at their request, then a freeze.
          5. Implementation agents per module, told "own files only; never change a statement; if
             a helper is false, prove a corrected version under a new name and report; report
             false upstream statements immediately".
          6. Coordinator merges with the freeze-check, then comparator.
          7. Phase 2: blueprint/feasibility agents for each cited result, implementation of the
             feasible ones, and a second review round (Opus) on the phase-2 blueprints and on the
             blueprint as documentation of the final code.
    - method: "agent"
      models: ["gpt-6.1-sol"]
      framework: "Codex"
      tool_setup: >-
        A coordinating Codex session completed Theorem F and Pavlov's BMO necessity consequence
        using GPT-6.1 Sol implementation and independent review agents, as requested by the user.
        Agents owned disjoint source modules, documented interfaces and proofs before risky
        implementation, and ran Lean/Lake against the pinned Mathlib. Theorem F uses normalized
        reproducing kernels, Cauchy–Schwarz and explicit measure algebra. Pavlov uses cardinal
        synthesis, finite weighted Cauchy tests, A₂-to-log-BMO, weighted Schwarz integrals,
        finite-order zero cancellation, harmonic reflection, an outer H² comparison, PW
        uniqueness, L² multiplier kernel realization, localized conjugate-Poisson BMO estimates,
        and a Fatou boundary limit. Selected Tau Ceti modules are copied unchanged with pinned
        provenance and upstream elaboration options scoped to that library. Original cited
        Props and strongest main statements are not weakened; conditional aliases remain.
        Verification includes full builds, explicit axiom audits, statement checks and the
        self-contained 46-theorem comparator target. Reviews R11–R15 record the proof reviews
        and code audits; R14 and R15 independently check complementary Pavlov components.
      prompting_notes: >-
        The user requested completion of the formerly deferred Theorem F and PavlovBMO, required
        GPT-6.1 Sol subagents, and authorized external library reuse. The formerly infeasible
        Pavlov assessment was replaced by a specialized modular proof; its conclusion remains
        only the BMO necessity consequence used by the paper, not the full characterization.
  spend_usd: "not tracked (subscription usage)"
  notes: >-
    Problems in the source caught by the process (NOTEBOOK.md):
      - Meĭman's theorem as quoted on p. 801 is false (cos πz, e^{az} sin πz); the formalization
        proves the needed case directly (N-17).
      - The proof of Theorem 2 (ii) does not work as printed (the auxiliary ε_n does not tend to
        0; the key estimate (11) fails); a new, simpler proof was found by the blueprint writer,
        confirmed by a referee with numerics, and formalized (N-21).
      - Theorem 2 (i) needs a regularity hypothesis on ψ that its statement omits; a ψ satisfying
        all stated hypotheses defeats the paper's construction (N-22). Two formal versions.
      - Theorem F as printed (for the closed Hermite–Biehler class) is false, e.g. for E = 1
        (N-37); the formal version is for the strict class.
      - A sign error and a missing 1/π in the Herglotz representation (3) (N-07); a false
        second-order bound on p. 804 (N-23); wrong integration ranges on p. 802 (N-20); several
        unjustified steps (dominated convergence on p. 797, the real factor S, the bound
        |E| ≃ e^{π Im z} in Corollary 2).
    Statement changes after the review round (NOTEBOOK I-01): a second version of Theorem 2 (i)
    with the density bound the proof uses; a stronger sharpness statement for Landau's inequality.
    The definition of the Paley–Wiener Prop was corrected before any review (M01 writer).
    Implementation found no false helper statement in the reviewed phase-1 scaffold. In phase 2,
    referee R10 found one false helper statement, division_lemma, in the former scaffold of de
    Branges' Theorem F (Lean disproof: the factorization data were not tied to the factorization
    step). It and the abandoned factorization scaffold were retired; the elementary proof does
    not use them. PartF.lean and FourierFramesScaffold remain import-only compatibility modules.

fidelity:
  divergences: >-
    1. Sequences are sets of reals (Set ℝ); Theorem 1 is about separated sequences, so nothing is
       lost. Sums, integrals and norms are ℝ≥0∞-valued.
    2. The cited results are explicit Prop hypotheses in the weakest form the paper uses:
       Theorems D, E, F for E in the strict Hermite–Biehler class without real zeros (necessary:
       Theorem F fails for E = 1), Theorem F with an extra term p·y, Theorem A only in its BMO
       necessity part, the Paley–Wiener theorem in the two-part Paley–Wiener–Plancherel form.
    3. The potential U_ψ keeps the convergence term Re(z/t) only for |t| > 1, since the paper's
       principal value need not exist for ψ ∈ C¹ (N-03); Corollary 2 is insensitive to this.
       Its approximation hypothesis is stated multiplicatively, e^{U_ψ − C} ≤ |f| ≤ e^{U_ψ + C}.
    4. Theorem 2 (i) carries the extra hypothesis "ψ' eventually nonincreasing"
       (theorem2_i), or the local density bound ψ' ≲ 1/d_n on the cells of the partition
       (theorem2_i_of_densityBound). Both drop the unused hypothesis ψ' = 1/O(x) of the printed
       statement (theorem2_i since the final lint pass, NOTEBOOK N-26, I-03).
    5. Theorem 2 (ii) is proved by a different test function (two negative density ramps around
       a long window where ψ is nearly a half-integer).
    6. landau_sharp states that no coefficient A < 1 of log⁺(b − a) works for {k + log⁺|k|}
       (stronger than "the logarithmic term cannot be removed").
    7. Proof-level changes: Theorem D is not used for Theorem 1 (Theorem E suffices); Meĭman's
       theorem and Levin's theorem are replaced by direct arguments; the real factor S of p. 796
       is a Weierstrass product of variable genus; the limit α → π/2 uses a uniform
       Plancherel–Pólya tail bound; the Herglotz representation uses the kernel
       1/(λ − z) − λ/(1 + λ²).

review:
  status: "agent-reviewed"
  reviewers:
    - "Independent Claude agent (R1: definitions, cited Props and main statements: truth, vacuity, fidelity)"
    - "Independent Claude agent (R2: Paley–Wiener and Hermite–Biehler modules, against the page images)"
    - "Independent Claude agent (R3: Theorem 1, Corollary 1, Landau's inequality)"
    - "Independent Claude agent (R4: the example, the construction, Corollary 2)"
    - "Independent Claude agent (R5: Theorem 2, with numerical checks of the new proof of (ii))"
    - "Independent Claude agents (R6–R8, Opus: phase-2 blueprints; the blueprint as documentation of the final code; soundness audit)"
    - "Independent Claude agent (R9: blueprint and scaffold of de Branges' Theorems D and E, with numerical checks; no false statement, 8 minor findings)"
    - "Independent Claude agent (R10: blueprint and scaffold of de Branges' Theorem C, with numerical checks; no false Part C statement, 5 minor findings; division_lemma of the deferred Theorem F scaffold false as stated, with a Lean disproof)"
    - "Independent agent (R11: elementary Theorem F blueprint, finite-measure Cauchy helpers and probability normalization; approved for implementation)"
    - "Independent GPT-6.1 Sol agent (R12: Theorem F code audit, no mathematical defects found)"
    - "Independent GPT-6.1 Sol agent (R13: modular Pavlov blueprints and analytic interfaces, approved)"
    - "Independent GPT-6.1 Sol agent (R14: end-to-end Pavlov assembly code audit, no mathematical defects found; excludes components authored by that reviewer)"
    - "Independent GPT-6.1 Sol agent (R15: complementary logarithmic dispersion code audit, no mathematical defects found)"
  notes: >-
    Full referee reports are in reviews/. The phase-1 round found no false or vacuous statement
    and no broken proof; it confirmed the errata against the printed pages (and corrected three
    notebook entries), and requested two statement strengthenings, applied before the freeze.

