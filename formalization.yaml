status:
  scope: >-
    The whole article, with the cited results as explicit hypotheses.
      - Proved (phase 1): Theorem 1 (both directions), the remark of p. 797, Corollary 1, the
        Claim of §4 (Landau's inequality), the example of p. 798 and the sharpness of Landau's
        inequality, Corollary 2, Theorem 2 (i) (with the regularity hypothesis its proof needs,
        NOTEBOOK N-22) and Theorem 2 (ii) (by a new proof, NOTEBOOK N-21), the equivalence of
        Fourier frames and sampling (p. 790), and the "evident fact" of p. 799.
      - Proved (phase 2, cited results): the Paley–Wiener theorem; the John–Nirenberg inequality;
        Duffin–Schaeffer's Lemma III (from the Paley–Wiener theorem, hence unconditional); de
        Branges' Theorems C, D, E and F; Pavlov's BMO necessity consequence.
      - Unconditional (phase 2, FourierFrames/Unconditional.lean): the equivalence of Fourier
        frames and sampling, the "evident fact", Theorem 1 (both directions), Corollary 1, the remark of p. 797, the
        example of p. 798 and the sharpness of Landau's inequality, Corollary 2, both versions of
        Theorem 2 (i), and Landau's inequality; Theorem 2 (ii) and the counting estimate of the
        example were already unconditional. Historical conditional aliases retain their parameters.
      - Not formalized: the full Pavlov iff criterion, the Proposition of p. 798 and the
        remarks quoting [Se95].
