# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml (v0.4): repo-root metadata for this formalization project.

version: "v0.4"

project:
  name: "Fourier frames (Ortega-Cerdà–Seip 2002)"
  description: >-
    A Lean 4 / Mathlib formalization of J. Ortega-Cerdà and K. Seip, "Fourier frames", Ann. of
    Math. (2) 155 (2002), 789–806 (MR1923965).

    The paper characterizes the sequences of real frequencies that generate Fourier frames,
    equivalently the sampling sequences for the Paley–Wiener space PW: a separated sequence Λ is
    sampling if and only if there are Hermite–Biehler functions E, F with H(E) = PW such that Λ is
    the zero set of EF + E^*F^* (Theorem 1). Consequences: Corollary 1 (a sampling sequence is
    everywhere denser than a complete interpolating sequence), Landau's density inequality as a
    consequence of the John–Nirenberg theorem and Pavlov's theorem, the sharpness of Landau's
    inequality via the example {k + log⁺|k|}, Corollary 2 (a sufficient condition for sampling in
    terms of the approximation of a logarithmic potential by log|f|), and Theorem 2, which
    determines the critical growth of ψ for which {λ : λ + ψ(λ) ∈ ℤ} is sampling.

    The paper rests on cited theorems (the Paley–Wiener theorem, de Branges' Theorems C, D, E, F,
    Pavlov's Theorem A, the John–Nirenberg theorem, Lemma III of Duffin–Schaeffer). Each enters
    the formal statements as an explicit Prop hypothesis, never as an axiom. Phase 1 proves every
    argument of the paper itself from these hypotheses (all 15 main statements, accepted by
    comparator). Phase 2 proves the cited results that are within reach: the John–Nirenberg
    inequality and Duffin–Schaeffer's lemma are proved; the Paley–Wiener theorem and de Branges'
    Theorems D and E are in progress; Theorems C and F and Pavlov's theorem are assessed in
    blueprint/PHASE2.md.

    Two of the paper's proofs are replaced: the appeal to Meĭman's theorem (false as quoted) by a
    direct argument, and the proof of Theorem 2 (ii), which does not work as printed, by a new
    construction. Theorem 2 (i) needs a regularity hypothesis the printed statement omits. The
    errata are in NOTEBOOK.md.

    The formalization was directed by the first author of the paper.
  authors:
    - "Claude (Fable 5.1 / Opus 5.5 / Sonnet 5.5, Anthropic), multi-agent run in Claude Code"
    - "Joaquim Ortega-Cerdà (direction)"
  responsible_maintainers:
    - "Joaquim Ortega-Cerdà"
  license: "Apache-2.0"

sources:
  - title: "Fourier frames"
    authors:
      - "Joaquim Ortega-Cerdà"
      - "Kristian Seip"
    id: "Ann. of Math. (2) 155 (2002), no. 3, 789–806; doi:10.2307/3062132; MR1923965"
    type: "article"
    location: "Theorem 1, Corollaries 1–2, Theorem 2, the Claim of §4 and the example of p. 798, and the remarks of pp. 790, 797, 799 that are used (Sections 1–5)"
    relationship: "formalizes"
    note: >-
      Statements of the published version (the journal PDF). Errata, gaps and simplifications
      found in the source are recorded in NOTEBOOK.md (38 entries, confirmed by independent referee
      agents against the printed pages). The Proposition of p. 798 (quoted from [Or98]) and the
      remarks quoting [Se95] are not formalized.
    author_endorsement: "participated"
  - title: "Hilbert spaces of entire functions"
    authors:
      - "Louis de Branges"
    id: "Prentice-Hall, 1968 (cited as [dB68]); and Trans. Amer. Math. Soc. 96 (1960), 259–295 ([dB60])"
    type: "book"
    location: "Theorems 19, 22, 23, 32 (the paper's Theorems D, E, C, F)"
    relationship: "background"
    note: >-
      Assumed as the explicit Prop hypotheses FF.TheoremC, FF.TheoremD, FF.TheoremE, FF.TheoremF of
      the main statements that use them, in the weakest form the paper uses (Theorems D, E, F for E
      in the strict Hermite–Biehler class without real zeros; Theorem F with an extra term p·y,
      p ≥ 0). Proofs of D and E are in progress (blueprint/P3_DeBrangesDE.md); C and F are assessed
      in blueprint/P4_DeBrangesFC.md.
    author_endorsement: "n/a"
  - title: "Unconditional bases of exponentials and reproducing kernels"
    authors:
      - "Sergei V. Hruščev"
      - "Nikolai K. Nikol'skiĭ"
      - "Boris S. Pavlov"
    id: "Lecture Notes in Math. 864 (1981), 214–335 (cited as [HNP81]; Pavlov's theorem [Pa79])"
    type: "article"
    location: "The paper's Theorem A, p. 791"
    relationship: "background"
    note: >-
      Only the BMO necessity half is used (FF.PavlovBMO: a separated complete interpolating
      sequence Γ has n_Γ(t) − t ∈ BMO). Assumed as a hypothesis of FF.landau_inequality; proving it
      would need the Hilbert transform, Muckenhoupt weights and BMO conjugation, which Mathlib lacks
      (blueprint/P5_Pavlov.md).
    author_endorsement: "n/a"
  - title: "On functions of bounded mean oscillation"
    authors:
      - "Fritz John"
      - "Louis Nirenberg"
    id: "Comm. Pure Appl. Math. 14 (1961), 415–426 (cited as [JN61])"
    type: "article"
    location: "The John–Nirenberg inequality, used on p. 799"
    relationship: "background"
    note: "Proved in the project (FF.johnNirenberg_holds, FourierFrames/Cited/JohnNirenberg.lean), by the dyadic stopping-time argument, with C = 2 and c = log 2/4."
    author_endorsement: "n/a"
  - title: "A class of nonharmonic Fourier series"
    authors:
      - "Richard J. Duffin"
      - "Albert C. Schaeffer"
    id: "Trans. Amer. Math. Soc. 72 (1952), 341–366 (cited as [DS52])"
    type: "article"
    location: "Lemma III, used on p. 800"
    relationship: "background"
    note: "Proved in the project from the Paley–Wiener theorem (FF.dsPerturbation_of_paleyWiener), by an L² Bernstein inequality and the fundamental theorem of calculus."
    author_endorsement: "n/a"
  - title: "Multipliers for entire functions and an interpolation problem of Beurling"
    authors:
      - "Joaquim Ortega-Cerdà"
      - "Kristian Seip"
    id: "J. Funct. Anal. 162 (1999), 400–415 (cited as [OS99]); MR1682065"
    type: "article"
    location: "Lemma 3 (the multiplier lemma), used on pp. 801 and 805"
    relationship: "builds-on"
    note: >-
      Not assumed: the sorry-free part of the companion formalization
      https://github.com/joaquimortega/MR1682065 that proves Lemma 3 (OCS.lemma3, 10 files, commit
      05e3ac2ca83f8862636e1dd002467ad9add83396) is vendored in OrtegaCerdaSeip/. A version uniform
      in the density is re-proved in FourierFrames/Lemma3Uniform.lean.
    author_endorsement: "participated"

