    note: >-
      Selected unchanged v4.35.0 modules, commit 1f9b4414105d86e487a4ac4c3d3397076a44d0d2:
      41 modules and 8882 lines, Apache-2.0. Import closures cover the L² Fourier multiplier,
      Calderón–Zygmund BMO endpoint, Harnack, disk Dirichlet problem, Laplacian comparison,
      and analytic logarithm branch. The project proves the specialized kernel realization,
      weighted tests and extension to general BMO data; the endpoint theorem alone is not a
      general BMO extension. Provenance and full inventory: TauCeti/VENDORED.md. Original
      autoImplicit and relaxedAutoImplicit options are scoped to the TauCeti Lake library.

